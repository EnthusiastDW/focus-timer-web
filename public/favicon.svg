<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 58 58">
  <defs>
    <linearGradient id="tomatoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Circular background -->
  <circle cx="29" cy="29" r="27" fill="url(#tomatoGrad)"/>
  <!-- Clock face -->
  <circle cx="29" cy="29" r="18" fill="#fff" opacity="0.92"/>
  <circle cx="29" cy="29" r="17" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <!-- Hour markers -->
  <line x1="29" y1="13" x2="29" y2="15" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="29" y1="43" x2="29" y2="45" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="13" y1="29" x2="15" y2="29" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="43" y1="29" x2="45" y2="29" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Clock hands - showing 25 minutes (Pomodoro time) -->
  <line x1="29" y1="29" x2="29" y2="18" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <line x1="29" y1="29" x2="37" y2="26" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="29" cy="29" r="1.5" fill="#7c3aed"/>
</svg>
